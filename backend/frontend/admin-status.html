<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Status — Pots of Plenty</title>
    
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="/style.css?v=13">
    <link rel="stylesheet" href="/admin.css?v=13">
    <script src="/admin-shell.js?v=13"></script>

    <style>
        .admin-status-wrap {
            width: 92%;
            max-width: 1400px;
            margin: auto;
            padding: 60px 0;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .admin-header h1 {
            font-size: 46px;
            margin-bottom: 8px;
        }

        .status-summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(160px, 1fr));
            gap: 16px;
            margin: 30px 0;
        }

        .status-card {
            padding: 22px;
            border-radius: 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .status-card span {
            display: block;
            opacity: .7;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .status-card strong {
            font-size: 24px;
        }

        .status-good {
            border-left: 5px solid #38d66b;
        }

        .status-warning {
            border-left: 5px solid #ffc857;
        }

        .status-bad {
            border-left: 5px solid #ff5b5b;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .panel {
            padding: 25px;
            border-radius: 18px;
            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .panel h3 {
            margin-bottom: 18px;
            font-size: 24px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-row span:first-child {
            opacity: .65;
        }

        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-good {
            color: #071b0d;
            background: #38d66b;
        }

        .badge-warning {
            color: #1d1600;
            background: #ffc857;
        }

        .badge-bad {
            color: white;
            background: #d63838;
        }

        .warnings {
            margin-top: 30px;
            padding: 25px;
            border-radius: 18px;
            background: rgba(255,91,91,0.1);
            border: 1px solid rgba(255,91,91,0.35);
        }

        .warnings h3 {
            margin-bottom: 12px;
        }

        .warnings li {
            margin-bottom: 8px;
        }

        .admin-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .small-btn {
            padding: 11px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.08);
            color: white;
            cursor: pointer;
            font-weight: 800;
            text-decoration: none;
        }

        .small-btn:hover {
            background: rgba(255,255,255,0.16);
        }

        .muted {
            opacity: .7;
            font-size: 14px;
        }

        .loading-state,
        .empty-state {
            padding: 35px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 900px) {
            .status-summary-grid,
            .status-grid {
                grid-template-columns: 1fr;
            }

            .admin-header h1 {
                font-size: 36px;
            }

            .status-row {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

<section class="admin-status-wrap">

    <div class="admin-header">
        <div>
            <h1>Site Status</h1>
            <p style="opacity:.7;">Server, Stripe, Railway and vessel tracking health.</p>
        </div>

        <a href="/admin-dashboard" class="hero-btn">
            ← Back to Dashboard
        </a>
    </div>

    <div class="admin-controls">
        <button class="small-btn" id="refreshBtn">
            Refresh Status
        </button>

        <a href="/api/admin/status" class="small-btn" target="_blank" rel="noopener noreferrer">
            Raw API
        </a>

        <span class="muted" id="lastChecked">
            Not checked yet
        </span>
    </div>

    <div id="status" style="margin-top:30px;">
        <div class="loading-state">
            Loading status...
        </div>
    </div>

</section>

<script>
const token = localStorage.getItem("adminToken");

if (!token) {
    window.location.href = "/admin";
}

const statusBox = document.getElementById("status");
const refreshBtn = document.getElementById("refreshBtn");
const lastChecked = document.getElementById("lastChecked");

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function formatDuration(seconds) {
    seconds = Number(seconds || 0);

    const days = Math.floor(seconds / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);

    if (days > 0) {
        return `${days}d ${hours}h ${minutes}m`;
    }

    if (hours > 0) {
        return `${hours}h ${minutes}m`;
    }

    return `${minutes}m`;
}

function formatAge(seconds) {
    if (seconds === null || seconds === undefined) {
        return "No live data yet";
    }

    if (seconds < 60) {
        return `${seconds}s ago`;
    }

    if (seconds < 3600) {
        return `${Math.floor(seconds / 60)}m ago`;
    }

    return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m ago`;
}

function badge(ok, warningText = false) {
    if (ok) {
        return `<span class="badge badge-good">OK</span>`;
    }

    if (warningText) {
        return `<span class="badge badge-warning">Warning</span>`;
    }

    return `<span class="badge badge-bad">Issue</span>`;
}

function summaryClass(ok, warning = false) {
    if (ok) return "status-good";
    if (warning) return "status-warning";
    return "status-bad";
}

function renderStatus(data, responseMs) {
    const stripeOk = data.stripe.keyLoaded && data.stripe.apiConnected;
    const aisKeyOk = data.ais.keyLoaded;
    const aisOpen = data.ais.connection === "Open";
    const vesselFresh =
        data.vessel.dataAgeSeconds !== null &&
        data.vessel.dataAgeSeconds !== undefined &&
        data.vessel.dataAgeSeconds < 3600;

    const overallOk =
        stripeOk &&
        aisKeyOk &&
        aisOpen &&
        data.server.status === "online";

    const lat = data.vessel.latitude;
    const lon = data.vessel.longitude;

    statusBox.innerHTML = `
        <div class="status-summary-grid">
            <div class="status-card ${summaryClass(data.server.status === "online")}">
                <span>Server</span>
                <strong>${data.server.status === "online" ? "Online" : "Offline"}</strong>
            </div>

            <div class="status-card ${summaryClass(stripeOk)}">
                <span>Stripe</span>
                <strong>${stripeOk ? "Connected" : "Issue"}</strong>
            </div>

            <div class="status-card ${summaryClass(aisOpen, aisKeyOk && !aisOpen)}">
                <span>AIS Tracking</span>
                <strong>${escapeHTML(data.ais.connection)}</strong>
            </div>

            <div class="status-card ${summaryClass(overallOk, !overallOk)}">
                <span>Overall</span>
                <strong>${overallOk ? "Healthy" : "Needs Check"}</strong>
            </div>
        </div>

        ${
            data.warnings && data.warnings.length
            ? `
                <div class="warnings">
                    <h3>Action Needed</h3>
                    <ul>
                        ${data.warnings.map(warning => `
                            <li>${escapeHTML(warning)}</li>
                        `).join("")}
                    </ul>
                </div>
            `
            : ""
        }

        <div class="status-grid">
            <div class="panel">
                <h3>Server</h3>

                <div class="status-row">
                    <span>Status</span>
                    <strong>${badge(data.server.status === "online")}</strong>
                </div>

                <div class="status-row">
                    <span>Uptime</span>
                    <strong>${formatDuration(data.server.uptimeSeconds)}</strong>
                </div>

                <div class="status-row">
                    <span>Started</span>
                    <strong>${new Date(data.server.startedAt).toLocaleString()}</strong>
                </div>

                <div class="status-row">
                    <span>Response Time</span>
                    <strong>${responseMs}ms</strong>
                </div>

                <div class="status-row">
                    <span>Node Environment</span>
                    <strong>${escapeHTML(data.server.nodeEnv)}</strong>
                </div>
            </div>

            <div class="panel">
                <h3>Environment</h3>

                <div class="status-row">
                    <span>Base URL</span>
                    <strong>${escapeHTML(data.environment.baseUrl)}</strong>
                </div>

                <div class="status-row">
                    <span>Railway Port</span>
                    <strong>${badge(data.environment.railwayPortLoaded)}</strong>
                </div>

                <div class="status-row">
                    <span>Checked</span>
                    <strong>${new Date(data.server.checkedAt).toLocaleString()}</strong>
                </div>
            </div>

            <div class="panel">
                <h3>Stripe</h3>

                <div class="status-row">
                    <span>Secret Key</span>
                    <strong>${badge(data.stripe.keyLoaded)}</strong>
                </div>

                <div class="status-row">
                    <span>API Connection</span>
                    <strong>${badge(data.stripe.apiConnected)}</strong>
                </div>

                <div class="status-row">
                    <span>Message</span>
                    <strong>${escapeHTML(data.stripe.message)}</strong>
                </div>
            </div>

            <div class="panel">
                <h3>AIS Tracking</h3>

                <div class="status-row">
                    <span>AIS Key</span>
                    <strong>${badge(data.ais.keyLoaded, !data.ais.keyLoaded)}</strong>
                </div>

                <div class="status-row">
                    <span>WebSocket</span>
                    <strong>${escapeHTML(data.ais.connection)}</strong>
                </div>

                <div class="status-row">
                    <span>Latest Position</span>
                    <strong>${vesselFresh ? badge(true) : badge(false, true)}</strong>
                </div>

                <div class="status-row">
                    <span>Data Age</span>
                    <strong>${formatAge(data.vessel.dataAgeSeconds)}</strong>
                </div>
            </div>

            <div class="panel">
                <h3>Vessel</h3>

                <div class="status-row">
                    <span>Name</span>
                    <strong>${escapeHTML(data.vessel.name)}</strong>
                </div>

                <div class="status-row">
                    <span>MMSI</span>
                    <strong>${escapeHTML(data.vessel.mmsi)}</strong>
                </div>

                <div class="status-row">
                    <span>Callsign</span>
                    <strong>${escapeHTML(data.vessel.callsign)}</strong>
                </div>

                <div class="status-row">
                    <span>Position</span>
                    <strong>
                        ${
                            lat && lon
                            ? `${Number(lat).toFixed(5)}, ${Number(lon).toFixed(5)}`
                            : "No position"
                        }
                    </strong>
                </div>

                <div class="status-row">
                    <span>Speed</span>
                    <strong>
                        ${data.vessel.sog !== null ? `${data.vessel.sog} kn` : "Unknown"}
                    </strong>
                </div>

                <div class="status-row">
                    <span>Course</span>
                    <strong>
                        ${data.vessel.cog !== null ? `${data.vessel.cog}°` : "Unknown"}
                    </strong>
                </div>
            </div>

            <div class="panel">
                <h3>Useful Links</h3>

                <div class="status-row">
                    <span>Home</span>
                    <a href="/" target="_blank" class="small-btn">Open</a>
                </div>

                <div class="status-row">
                    <span>Shop</span>
                    <a href="/shop" target="_blank" class="small-btn">Open</a>
                </div>

                <div class="status-row">
                    <span>Orders</span>
                    <a href="/admin-orders" class="small-btn">Open</a>
                </div>

                <div class="status-row">
                    <span>Tracking</span>
                    <a href="/track" target="_blank" class="small-btn">Open</a>
                </div>
            </div>
        </div>
    `;
}

async function loadStatus() {
    statusBox.innerHTML = `
        <div class="loading-state">
            Checking system status...
        </div>
    `;

    const started = performance.now();

    try {
        const res = await fetch("/api/admin/status", {
            headers: {
                Authorization: `Bearer ${token}`
            }
        });

        if (res.status === 401) {
            localStorage.removeItem("adminToken");
            window.location.href = "/admin";
            return;
        }

        const data = await res.json();
        const responseMs = Math.round(performance.now() - started);

        if (!data.success) {
            statusBox.innerHTML = `
                <div class="empty-state">
                    Status API returned an error.
                </div>
            `;
            return;
        }

        lastChecked.textContent = `Last checked: ${new Date().toLocaleString()}`;

        renderStatus(data, responseMs);

    } catch (err) {
        console.error(err);

        statusBox.innerHTML = `
            <div class="empty-state">
                Status check failed.
            </div>
        `;
    }
}

refreshBtn.addEventListener("click", loadStatus);

loadStatus();

setInterval(loadStatus, 30000);
</script>

</body>
</html>
