<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Orders — Pots of Plenty</title>
    
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style.css?v=11">
    <link rel="stylesheet" href="/admin.css?v=11">
    <script src="/admin-shell.js?v=11"></script>
</head>

<body>

<header class="admin-header">
    <div>
        <h1>Orders</h1>
        <p>View, filter, manage fulfilment and contact customers.</p>
    </div>

    <div class="admin-actions">
        <button class="admin-btn" id="refreshBtn">Refresh</button>
        <button class="admin-btn" id="copyVisibleBtn">Copy Visible Orders</button>
        <a href="/admin-giveaway" class="admin-btn">Giveaway Entries</a>
        <a href="/admin-tools" class="admin-btn">API Tools</a>
        <a href="https://dashboard.stripe.com/payments" target="_blank" rel="noopener noreferrer" class="admin-btn primary">Open Stripe</a>
    </div>
</header>

<div class="admin-grid-4">
    <div class="admin-card">
        <span>Total Orders</span>
        <strong id="summaryTotal">0</strong>
    </div>

    <div class="admin-card status-good">
        <span>Paid Orders</span>
        <strong id="summaryPaid">0</strong>
    </div>

    <div class="admin-card status-warning">
        <span>Unpaid / Incomplete</span>
        <strong id="summaryUnpaid">0</strong>
    </div>

    <div class="admin-card">
        <span>Paid Revenue</span>
        <strong id="summaryRevenue">£0.00</strong>
    </div>
</div>

<div class="admin-controls">
    <input type="search" id="searchInput" placeholder="Search customer, email, phone, item or order ID...">

    <select id="paymentFilter">
        <option value="all">All payments</option>
        <option value="paid">Paid only</option>
        <option value="unpaid">Unpaid only</option>
        <option value="pending">Pending / other</option>
    </select>

    <select id="fulfilmentFilter">
        <option value="all">All fulfilment</option>
        <option value="new">New</option>
        <option value="packed">Packed</option>
        <option value="ready">Ready for collection</option>
        <option value="collected">Collected</option>
        <option value="issue">Issue</option>
        <option value="refunded">Refunded</option>
    </select>

    <select id="sortSelect">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="highest">Highest total</option>
        <option value="lowest">Lowest total</option>
        <option value="payment">Payment status</option>
        <option value="fulfilment">Fulfilment status</option>
    </select>

    <button class="admin-btn" id="clearFiltersBtn">Clear</button>
</div>

<div id="orders">
    <div class="admin-loading">Loading orders...</div>
</div>

<script>
let allOrders = [];

const ordersContainer = document.getElementById("orders");
const searchInput = document.getElementById("searchInput");
const paymentFilter = document.getElementById("paymentFilter");
const fulfilmentFilter = document.getElementById("fulfilmentFilter");
const sortSelect = document.getElementById("sortSelect");
const refreshBtn = document.getElementById("refreshBtn");
const clearFiltersBtn = document.getElementById("clearFiltersBtn");
const copyVisibleBtn = document.getElementById("copyVisibleBtn");

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function moneyFromPence(value) {
    return `£${(Number(value || 0) / 100).toFixed(2)}`;
}

function getPaymentStatus(order) {
    const status = String(order.status || "").toLowerCase();

    if (status === "paid") return "paid";

    if (
        status === "unpaid" ||
        status === "requires_payment_method" ||
        status === "open"
    ) {
        return "unpaid";
    }

    return "pending";
}

function getFulfilment(order) {
    return order.admin?.fulfilment || "new";
}

function paymentBadge(order) {
    const status = getPaymentStatus(order);

    if (status === "paid") {
        return `<span class="admin-badge badge-good">Paid</span>`;
    }

    if (status === "unpaid") {
        return `<span class="admin-badge badge-bad">Not Paid</span>`;
    }

    return `<span class="admin-badge badge-warning">${escapeHTML(order.status || "Pending")}</span>`;
}

function fulfilmentBadge(status) {
    if (status === "packed") return `<span class="admin-badge badge-warning">Packed</span>`;
    if (status === "ready") return `<span class="admin-badge badge-good">Ready</span>`;
    if (status === "collected") return `<span class="admin-badge badge-good">Collected</span>`;
    if (status === "issue") return `<span class="admin-badge badge-bad">Issue</span>`;
    if (status === "refunded") return `<span class="admin-badge badge-bad">Refunded</span>`;

    return `<span class="admin-badge badge-neutral">New</span>`;
}

function updateSummary() {
    const paidOrders = allOrders.filter((order) => getPaymentStatus(order) === "paid");
    const unpaidOrders = allOrders.filter((order) => getPaymentStatus(order) !== "paid");

    const paidRevenue = paidOrders.reduce((sum, order) => {
        return sum + Number(order.amount_total || 0);
    }, 0);

    document.getElementById("summaryTotal").textContent = allOrders.length;
    document.getElementById("summaryPaid").textContent = paidOrders.length;
    document.getElementById("summaryUnpaid").textContent = unpaidOrders.length;
    document.getElementById("summaryRevenue").textContent = moneyFromPence(paidRevenue);
}

function getSearchText(order) {
    const itemText = Array.isArray(order.items)
        ? order.items.map((item) => item.name).join(" ")
        : "";

    return `
        ${order.id}
        ${order.customer_name}
        ${order.customer_email}
        ${order.phone}
        ${order.status}
        ${getFulfilment(order)}
        ${order.admin?.note || ""}
        ${itemText}
    `.toLowerCase();
}

function getFilteredOrders() {
    const search = searchInput.value.trim().toLowerCase();
    const payment = paymentFilter.value;
    const fulfilment = fulfilmentFilter.value;
    const sort = sortSelect.value;

    let orders = [...allOrders];

    if (search) {
        orders = orders.filter((order) => {
            return getSearchText(order).includes(search);
        });
    }

    if (payment !== "all") {
        orders = orders.filter((order) => getPaymentStatus(order) === payment);
    }

    if (fulfilment !== "all") {
        orders = orders.filter((order) => getFulfilment(order) === fulfilment);
    }

    orders.sort((a, b) => {
        if (sort === "newest") return Number(b.created || 0) - Number(a.created || 0);
        if (sort === "oldest") return Number(a.created || 0) - Number(b.created || 0);
        if (sort === "highest") return Number(b.amount_total || 0) - Number(a.amount_total || 0);
        if (sort === "lowest") return Number(a.amount_total || 0) - Number(b.amount_total || 0);
        if (sort === "payment") return getPaymentStatus(a).localeCompare(getPaymentStatus(b));
        if (sort === "fulfilment") return getFulfilment(a).localeCompare(getFulfilment(b));

        return 0;
    });

    return orders;
}

function stripeLink(order) {
    if (order.payment_intent) {
        return `https://dashboard.stripe.com/payments/${encodeURIComponent(order.payment_intent)}`;
    }

    return "https://dashboard.stripe.com/payments";
}

function renderItems(order) {
    const items = Array.isArray(order.items) ? order.items : [];

    if (items.length === 0) {
        return `<p class="admin-muted">No item data found.</p>`;
    }

    return items.map((item) => `
        <p>
            <strong>${escapeHTML(item.quantity || 1)} × ${escapeHTML(item.name || "Item")}</strong><br>
            <span class="admin-muted">${moneyFromPence(item.amount)}</span>
        </p>
    `).join("");
}

function renderOrders() {
    updateSummary();

    const orders = getFilteredOrders();

    if (orders.length === 0) {
        ordersContainer.innerHTML = `
            <div class="admin-empty">
                No orders match your current filters.
            </div>
        `;
        return;
    }

    ordersContainer.innerHTML = `
        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Payment</th>
                        <th>Customer</th>
                        <th>Total</th>
                        <th>Fulfilment</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    ${orders.map((order) => `
                        <tr>
                            <td>
                                ${paymentBadge(order)}
                                <div class="admin-muted" style="font-size:11px;margin-top:6px;word-break:break-all;">
                                    ${escapeHTML(order.id)}
                                </div>
                            </td>

                            <td>
                                <strong>${escapeHTML(order.customer_name || "No name")}</strong>
                                <div class="admin-muted">${escapeHTML(order.customer_email || "No email")}</div>
                                <div class="admin-muted">${escapeHTML(order.phone || "No phone")}</div>
                            </td>

                            <td>
                                <strong>${moneyFromPence(order.amount_total)}</strong>
                            </td>

                            <td>
                                ${fulfilmentBadge(getFulfilment(order))}
                            </td>

                            <td>
                                ${
                                    order.created
                                        ? new Date(order.created * 1000).toLocaleString()
                                        : "Unknown"
                                }
                            </td>

                            <td>
                                <button class="admin-small-btn view-details" data-id="${escapeHTML(order.id)}">
                                    Details
                                </button>

                                <div class="admin-detail-box" id="details-${escapeHTML(order.id)}">
                                    <h3>Items</h3>
                                    ${renderItems(order)}

                                    <h3 style="margin-top:18px;">Fulfilment</h3>

                                    <select class="admin-input fulfilment-select" data-id="${escapeHTML(order.id)}">
                                        <option value="new" ${getFulfilment(order) === "new" ? "selected" : ""}>New order</option>
                                        <option value="packed" ${getFulfilment(order) === "packed" ? "selected" : ""}>Packed</option>
                                        <option value="ready" ${getFulfilment(order) === "ready" ? "selected" : ""}>Ready for collection</option>
                                        <option value="collected" ${getFulfilment(order) === "collected" ? "selected" : ""}>Collected</option>
                                        <option value="issue" ${getFulfilment(order) === "issue" ? "selected" : ""}>Issue</option>
                                        <option value="refunded" ${getFulfilment(order) === "refunded" ? "selected" : ""}>Refunded</option>
                                    </select>

                                    <textarea
                                        class="admin-textarea order-note"
                                        data-id="${escapeHTML(order.id)}"
                                        placeholder="Internal order note..."
                                        style="margin-top:10px;"
                                    >${escapeHTML(order.admin?.note || "")}</textarea>

                                    <div class="admin-actions" style="margin-top:12px;">
                                        <button class="admin-small-btn save-status" data-id="${escapeHTML(order.id)}">
                                            Save Status
                                        </button>

                                        <a class="admin-small-btn" href="tel:${escapeHTML(order.phone || "")}">
                                            Call
                                        </a>

                                        <a class="admin-small-btn" href="mailto:${escapeHTML(order.customer_email || "")}">
                                            Email
                                        </a>

                                        <a class="admin-small-btn" href="${stripeLink(order)}" target="_blank" rel="noopener noreferrer">
                                            Stripe
                                        </a>

                                        <button class="admin-small-btn copy-summary" data-id="${escapeHTML(order.id)}">
                                            Copy Summary
                                        </button>

                                        <button class="admin-small-btn copy-collection" data-id="${escapeHTML(order.id)}">
                                            Copy Collection Msg
                                        </button>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function getOrderById(orderId) {
    return allOrders.find((order) => order.id === orderId);
}

function getOrderSummary(order) {
    const items = Array.isArray(order.items)
        ? order.items.map((item) => `${item.quantity || 1} × ${item.name}`).join("\n")
        : "No items";

    return `
POTS OF PLENTY ORDER

Customer: ${order.customer_name}
Email: ${order.customer_email}
Phone: ${order.phone}

Payment: ${order.status}
Total: ${moneyFromPence(order.amount_total)}
Fulfilment: ${getFulfilment(order)}

Items:
${items}

Order ID:
${order.id}
`.trim();
}

function getCollectionMessage(order) {
    return `
Hi ${order.customer_name},

Your Pots of Plenty order is ready for collection from Scarborough Harbour.

Order total: ${moneyFromPence(order.amount_total)}

Please bring your order confirmation when collecting.

Thanks,
Pots of Plenty
`.trim();
}

async function copyText(text) {
    try {
        await navigator.clipboard.writeText(text);
        alert("Copied");
    } catch {
        prompt("Copy text:", text);
    }
}

async function saveOrderStatus(orderId) {
    const fulfilment = document.querySelector(`.fulfilment-select[data-id="${CSS.escape(orderId)}"]`)?.value || "new";
    const note = document.querySelector(`.order-note[data-id="${CSS.escape(orderId)}"]`)?.value || "";

    const res = await window.adminFetch(`/api/admin/orders/${encodeURIComponent(orderId)}/status`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            fulfilment,
            note
        })
    });

    if (!res) return;

    const data = await res.json();

    if (!data.success) {
        alert("Could not save status");
        return;
    }

    const order = getOrderById(orderId);

    if (order) {
        order.admin = {
            fulfilment,
            note,
            updatedAt: new Date().toISOString()
        };
    }

    renderOrders();
}

async function loadOrders() {
    ordersContainer.innerHTML = `<div class="admin-loading">Loading orders...</div>`;

    try {
        const res = await window.adminFetch("/api/admin/orders");

        if (!res) return;

        const data = await res.json();

        if (!data.success) {
            ordersContainer.innerHTML = `<div class="admin-empty">Could not load orders.</div>`;
            return;
        }

        allOrders = data.orders || [];

        renderOrders();

    } catch (err) {
        console.error(err);
        ordersContainer.innerHTML = `<div class="admin-empty">Order API failed.</div>`;
    }
}

ordersContainer.addEventListener("click", (e) => {
    const button = e.target.closest("button");

    if (!button) return;

    const orderId = button.dataset.id;

    if (button.classList.contains("view-details")) {
        document
            .getElementById(`details-${orderId}`)
            ?.classList.toggle("open");
    }

    if (button.classList.contains("save-status")) {
        saveOrderStatus(orderId);
    }

    if (button.classList.contains("copy-summary")) {
        const order = getOrderById(orderId);
        if (order) copyText(getOrderSummary(order));
    }

    if (button.classList.contains("copy-collection")) {
        const order = getOrderById(orderId);
        if (order) copyText(getCollectionMessage(order));
    }
});

function copyVisibleOrders() {
    const orders = getFilteredOrders();

    const report = orders.map((order) => {
        return getOrderSummary(order);
    }).join("\n\n----------------------\n\n");

    copyText(report || "No orders visible");
}

searchInput.addEventListener("input", renderOrders);
paymentFilter.addEventListener("change", renderOrders);
fulfilmentFilter.addEventListener("change", renderOrders);
sortSelect.addEventListener("change", renderOrders);
refreshBtn.addEventListener("click", loadOrders);
copyVisibleBtn.addEventListener("click", copyVisibleOrders);

clearFiltersBtn.addEventListener("click", () => {
    searchInput.value = "";
    paymentFilter.value = "all";
    fulfilmentFilter.value = "all";
    sortSelect.value = "newest";
    renderOrders();
});

loadOrders();
</script>

</body>
</html>
