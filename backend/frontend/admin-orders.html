<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Orders — Pots of Plenty</title>
    <link rel="stylesheet" href="/style.css">

    <style>
        .admin-orders-wrap {
            width: 92%;
            max-width: 1400px;
            margin: auto;
            padding: 60px 0;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .admin-header h1 {
            font-size: 46px;
            margin-bottom: 8px;
        }

        .admin-summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(160px, 1fr));
            gap: 16px;
            margin: 30px 0;
        }

        .summary-card {
            padding: 20px;
            border-radius: 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
        }

        .summary-card span {
            display: block;
            opacity: .7;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .summary-card strong {
            font-size: 28px;
        }

        .admin-controls {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 12px;
            margin: 30px 0;
        }

        .admin-controls input,
        .admin-controls select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 15px;
        }

        .admin-controls option {
            color: white;
        }

        .orders-table-wrap {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
        }

        table.orders-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        .orders-table th,
        .orders-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            vertical-align: top;
        }

        .orders-table th {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .08em;
            opacity: .65;
            background: rgba(255,255,255,0.05);
        }

        .orders-table tr.paid-row {
            border-left: 5px solid #38d66b;
        }

        .orders-table tr.unpaid-row {
            border-left: 5px solid #ff5b5b;
        }

        .orders-table tr.pending-row {
            border-left: 5px solid #ffc857;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .status-paid {
            color: #071b0d;
            background: #38d66b;
        }

        .status-unpaid {
            color: white;
            background: #d63838;
        }

        .status-pending {
            color: #1d1600;
            background: #ffc857;
        }

        .order-id {
            font-size: 12px;
            opacity: .55;
            word-break: break-all;
            margin-top: 6px;
        }

        .customer-name {
            font-weight: 800;
            margin-bottom: 4px;
        }

        .muted {
            opacity: .7;
            font-size: 14px;
        }

        .items-box {
            display: none;
            padding: 16px;
            margin-top: 12px;
            border-radius: 12px;
            background: rgba(0,0,0,0.25);
        }

        .items-box.open {
            display: block;
        }

        .small-btn {
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.08);
            color: white;
            cursor: pointer;
            font-weight: 800;
        }

        .small-btn:hover {
            background: rgba(255,255,255,0.16);
        }

        .empty-state,
        .loading-state {
            padding: 35px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        @media (max-width: 900px) {
            .admin-summary-grid,
            .admin-controls {
                grid-template-columns: 1fr;
            }

            .admin-header h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

<section class="admin-orders-wrap">

    <div class="admin-header">
        <div>
            <h1>Orders</h1>
            <p style="opacity:.7;">View, filter and sort recent Stripe checkout sessions.</p>
        </div>

        <a href="/admin-dashboard" class="hero-btn">
            ← Back to Dashboard
        </a>
    </div>

    <div class="admin-summary-grid">
        <div class="summary-card">
            <span>Total Orders</span>
            <strong id="summaryTotal">0</strong>
        </div>

        <div class="summary-card">
            <span>Paid Orders</span>
            <strong id="summaryPaid">0</strong>
        </div>

        <div class="summary-card">
            <span>Unpaid / Incomplete</span>
            <strong id="summaryUnpaid">0</strong>
        </div>

        <div class="summary-card">
            <span>Paid Revenue</span>
            <strong id="summaryRevenue">£0.00</strong>
        </div>
    </div>

    <div class="admin-controls">
        <input
            type="search"
            id="searchInput"
            placeholder="Search by customer, email, phone, item or order ID..."
        >

        <select id="statusFilter">
            <option value="all">All orders</option>
            <option value="paid">Paid only</option>
            <option value="unpaid">Unpaid only</option>
            <option value="pending">Pending / other</option>
        </select>

        <select id="sortSelect">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="highest">Highest total</option>
            <option value="lowest">Lowest total</option>
            <option value="status">Payment status</option>
        </select>

        <button class="small-btn" id="refreshBtn">
            Refresh
        </button>
    </div>

    <div id="orders">
        <div class="loading-state">Loading orders...</div>
    </div>

</section>

<script>
const token = localStorage.getItem("adminToken");

if (!token) {
    window.location.href = "/admin";
}

let allOrders = [];

const ordersContainer = document.getElementById("orders");
const searchInput = document.getElementById("searchInput");
const statusFilter = document.getElementById("statusFilter");
const sortSelect = document.getElementById("sortSelect");
const refreshBtn = document.getElementById("refreshBtn");

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function moneyFromPence(value) {
    const amount = Number(value || 0) / 100;
    return `£${amount.toFixed(2)}`;
}

function getOrderStatus(order) {
    const status = String(order.status || "").toLowerCase();

    if (status === "paid") {
        return "paid";
    }

    if (
        status === "unpaid" ||
        status === "requires_payment_method" ||
        status === "open"
    ) {
        return "unpaid";
    }

    return "pending";
}

function getStatusLabel(order) {
    const status = getOrderStatus(order);

    if (status === "paid") {
        return "Paid";
    }

    if (status === "unpaid") {
        return "Not Paid";
    }

    return escapeHTML(order.status || "Pending");
}

function getStatusClass(order) {
    const status = getOrderStatus(order);

    if (status === "paid") return "status-paid";
    if (status === "unpaid") return "status-unpaid";

    return "status-pending";
}

function getRowClass(order) {
    const status = getOrderStatus(order);

    if (status === "paid") return "paid-row";
    if (status === "unpaid") return "unpaid-row";

    return "pending-row";
}

function updateSummary() {
    const paidOrders = allOrders.filter(order => getOrderStatus(order) === "paid");
    const unpaidOrders = allOrders.filter(order => getOrderStatus(order) !== "paid");

    const paidRevenue = paidOrders.reduce((sum, order) => {
        return sum + Number(order.amount_total || 0);
    }, 0);

    document.getElementById("summaryTotal").textContent = allOrders.length;
    document.getElementById("summaryPaid").textContent = paidOrders.length;
    document.getElementById("summaryUnpaid").textContent = unpaidOrders.length;
    document.getElementById("summaryRevenue").textContent = moneyFromPence(paidRevenue);
}

function getSearchText(order) {
    const itemText = Array.isArray(order.items)
        ? order.items.map(item => item.name).join(" ")
        : "";

    return `
        ${order.id}
        ${order.customer_name}
        ${order.customer_email}
        ${order.phone}
        ${order.status}
        ${itemText}
    `.toLowerCase();
}

function getFilteredAndSortedOrders() {
    const search = searchInput.value.trim().toLowerCase();
    const filter = statusFilter.value;
    const sort = sortSelect.value;

    let orders = [...allOrders];

    if (search) {
        orders = orders.filter(order => {
            return getSearchText(order).includes(search);
        });
    }

    if (filter !== "all") {
        orders = orders.filter(order => getOrderStatus(order) === filter);
    }

    orders.sort((a, b) => {
        if (sort === "newest") {
            return Number(b.created || 0) - Number(a.created || 0);
        }

        if (sort === "oldest") {
            return Number(a.created || 0) - Number(b.created || 0);
        }

        if (sort === "highest") {
            return Number(b.amount_total || 0) - Number(a.amount_total || 0);
        }

        if (sort === "lowest") {
            return Number(a.amount_total || 0) - Number(b.amount_total || 0);
        }

        if (sort === "status") {
            return getOrderStatus(a).localeCompare(getOrderStatus(b));
        }

        return 0;
    });

    return orders;
}

function renderOrders() {
    updateSummary();

    const orders = getFilteredAndSortedOrders();

    if (orders.length === 0) {
        ordersContainer.innerHTML = `
            <div class="empty-state">
                No orders match your current filter.
            </div>
        `;
        return;
    }

    ordersContainer.innerHTML = `
        <div class="orders-table-wrap">
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>Payment</th>
                        <th>Customer</th>
                        <th>Total</th>
                        <th>Date</th>
                        <th>Items</th>
                        <th>Details</th>
                    </tr>
                </thead>

                <tbody>
                    ${orders.map((order, index) => {
                        const safeName = escapeHTML(order.customer_name || "No name");
                        const safeEmail = escapeHTML(order.customer_email || "No email");
                        const safePhone = escapeHTML(order.phone || "No phone");
                        const safeId = escapeHTML(order.id || "No ID");

                        const items = Array.isArray(order.items)
                            ? order.items
                            : [];

                        return `
                            <tr class="${getRowClass(order)}">
                                <td>
                                    <span class="status-badge ${getStatusClass(order)}">
                                        ${getStatusLabel(order)}
                                    </span>
                                    <div class="order-id">${safeId}</div>
                                </td>

                                <td>
                                    <div class="customer-name">${safeName}</div>
                                    <div class="muted">${safeEmail}</div>
                                    <div class="muted">${safePhone}</div>
                                </td>

                                <td>
                                    <strong>${moneyFromPence(order.amount_total)}</strong>
                                </td>

                                <td>
                                    ${order.created
                                        ? new Date(order.created * 1000).toLocaleString()
                                        : "Unknown date"
                                    }
                                </td>

                                <td>
                                    <strong>${items.length}</strong>
                                    item${items.length === 1 ? "" : "s"}
                                </td>

                                <td>
                                    <button class="small-btn" onclick="toggleOrderDetails(${index})">
                                        View Items
                                    </button>

                                    <div class="items-box" id="items-${index}">
                                        ${
                                            items.length
                                            ? items.map(item => `
                                                <p>
                                                    <strong>${escapeHTML(item.quantity || 1)} × ${escapeHTML(item.name || "Item")}</strong>
                                                    <br>
                                                    <span class="muted">${moneyFromPence(item.amount)}</span>
                                                </p>
                                            `).join("")
                                            : "<p>No item data found.</p>"
                                        }
                                    </div>
                                </td>
                            </tr>
                        `;
                    }).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function toggleOrderDetails(index) {
    const box = document.getElementById(`items-${index}`);

    if (box) {
        box.classList.toggle("open");
    }
}

async function loadOrders() {
    ordersContainer.innerHTML = `
        <div class="loading-state">
            Loading orders...
        </div>
    `;

    try {
        const res = await fetch("/api/admin/orders", {
            headers: {
                Authorization: `Bearer ${token}`
            }
        });

        if (res.status === 401) {
            localStorage.removeItem("adminToken");
            window.location.href = "/admin";
            return;
        }

        const data = await res.json();

        if (!data.success) {
            ordersContainer.innerHTML = `
                <div class="empty-state">
                    Could not load orders.
                </div>
            `;
            return;
        }

        allOrders = data.orders || [];

        renderOrders();

    } catch (err) {
        console.error(err);

        ordersContainer.innerHTML = `
            <div class="empty-state">
                Order API failed.
            </div>
        `;
    }
}

searchInput.addEventListener("input", renderOrders);
statusFilter.addEventListener("change", renderOrders);
sortSelect.addEventListener("change", renderOrders);
refreshBtn.addEventListener("click", loadOrders);

loadOrders();
</script>

</body>
</html>
