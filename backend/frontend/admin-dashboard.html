<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard — Pots of Plenty</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/admin.css">
    <script src="/admin-shell.js" defer></script>

    <script>
        const adminToken =
            localStorage.getItem("adminToken") ||
            localStorage.getItem("admin_token");

        if (!adminToken) {
            window.location.href = "/admin";
        }

        window.adminFetch = window.adminFetch || async function adminFetch(url, options = {}) {
            const headers = {
                ...(options.headers || {}),
                Authorization: `Bearer ${adminToken}`
            };

            const res = await fetch(url, {
                ...options,
                headers
            });

            if (res.status === 401) {
                localStorage.removeItem("adminToken");
                localStorage.removeItem("admin_token");
                window.location.href = "/admin";
                return null;
            }

            return res;
        };
    </script>
</head>

<body>

<header class="admin-header">
    <div>
        <h1>Dashboard</h1>
        <p>Store overview, recent orders, enquiries, system health and vessel tracking.</p>
        <p class="admin-muted" id="lastChecked">Loading dashboard...</p>
    </div>

    <div class="admin-actions">
        <button class="admin-btn" id="refreshBtn">Refresh</button>
        <button class="admin-btn" id="copyReportBtn">Copy Report</button>
        <a href="/" target="_blank" rel="noopener noreferrer" class="admin-btn primary">Open Site</a>
    </div>
</header>

<div id="dashboard">
    <div class="admin-loading">Loading admin dashboard...</div>
</div>

<script>
let dashboardData = null;

const dashboard = document.getElementById("dashboard");
const lastChecked = document.getElementById("lastChecked");
const refreshBtn = document.getElementById("refreshBtn");
const copyReportBtn = document.getElementById("copyReportBtn");

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function moneyFromPence(value) {
    return `£${(Number(value || 0) / 100).toFixed(2)}`;
}

function formatAge(seconds) {
    if (seconds === null || seconds === undefined) return "No live data yet";
    if (seconds < 60) return `${seconds}s ago`;
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;

    return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m ago`;
}

function formatDuration(seconds) {
    seconds = Number(seconds || 0);

    const days = Math.floor(seconds / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);

    if (days > 0) return `${days}d ${hours}h ${minutes}m`;
    if (hours > 0) return `${hours}h ${minutes}m`;

    return `${minutes}m`;
}

function badge(type, text) {
    return `<span class="admin-badge badge-${type}">${escapeHTML(text)}</span>`;
}

function statusClass(ok, warning = false) {
    if (ok) return "status-good";
    if (warning) return "status-warning";
    return "status-bad";
}

function paymentBadge(status) {
    const clean = String(status || "").toLowerCase();

    if (clean === "paid") return badge("good", "Paid");
    if (clean === "unpaid") return badge("bad", "Not Paid");

    return badge("warning", status || "Pending");
}

function renderWarnings(data) {
    if (!data.warnings || data.warnings.length === 0) {
        return `
            <div class="admin-success-box">
                <h3>✅ Everything Looks Healthy</h3>
                <p class="admin-muted">
                    Stripe, server checks and core settings are currently passing.
                </p>
            </div>
        `;
    }

    return `
        <div class="admin-warning-box">
            <h3>Action Needed</h3>
            <ul>
                ${data.warnings.map((warning) => `
                    <li>${escapeHTML(warning)}</li>
                `).join("")}
            </ul>
        </div>
    `;
}

function renderRecentOrders(orders) {
    if (!orders || orders.length === 0) {
        return `<div class="admin-empty">No recent Stripe orders found.</div>`;
    }

    return `
        <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Payment</th>
                        <th>Customer</th>
                        <th>Total</th>
                        <th>Fulfilment</th>
                        <th>Date</th>
                    </tr>
                </thead>

                <tbody>
                    ${orders.map((order) => `
                        <tr>
                            <td>${paymentBadge(order.status)}</td>

                            <td>
                                <strong>${escapeHTML(order.customer_name)}</strong>
                                <div class="admin-muted">${escapeHTML(order.customer_email)}</div>
                            </td>

                            <td><strong>${moneyFromPence(order.amount_total)}</strong></td>

                            <td>${renderFulfilmentBadge(order.admin?.fulfilment)}</td>

                            <td>
                                ${
                                    order.created
                                        ? new Date(order.created * 1000).toLocaleString()
                                        : "Unknown"
                                }
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        </div>
    `;
}

function renderFulfilmentBadge(status) {
    if (status === "packed") return badge("warning", "Packed");
    if (status === "ready") return badge("good", "Ready");
    if (status === "collected") return badge("good", "Collected");
    if (status === "issue") return badge("bad", "Issue");
    if (status === "refunded") return badge("bad", "Refunded");

    return badge("neutral", "New");
}

function renderMessages(messages) {
    if (!messages || messages.length === 0) {
        return `<div class="admin-empty">No customer messages yet.</div>`;
    }

    return messages.map((message) => `
        <div class="admin-row">
            <div>
                <strong>${message.read ? "✉️" : "📩"} ${escapeHTML(message.name)}</strong>
                <div class="admin-muted">${escapeHTML(message.subject || "Website enquiry")}</div>
            </div>

            <a href="/admin-messages" class="admin-small-btn">Open</a>
        </div>
    `).join("");
}

function renderDashboard(data) {
    const stripeOk = data.stripe.keyLoaded && data.stripe.apiConnected;
    const aisOk = data.ais.keyLoaded && data.ais.connection === "Open";
    const vesselFresh =
        data.vessel.dataAgeSeconds !== null &&
        data.vessel.dataAgeSeconds !== undefined &&
        data.vessel.dataAgeSeconds < 3600;

    dashboard.innerHTML = `
        <div class="admin-grid-4">
            <div class="admin-card ${statusClass(data.overview.paidRecentOrders > 0, true)}">
                <span>Recent Paid Orders</span>
                <strong>${data.overview.paidRecentOrders}</strong>
            </div>

            <div class="admin-card ${statusClass(data.overview.recentPaidRevenue > 0, true)}">
                <span>Recent Revenue</span>
                <strong>${moneyFromPence(data.overview.recentPaidRevenue)}</strong>
            </div>

            <div class="admin-card ${statusClass(data.overview.unreadMessages === 0, data.overview.unreadMessages > 0)}">
                <span>Unread Messages</span>
                <strong>${data.overview.unreadMessages}</strong>
            </div>

            <div class="admin-card ${statusClass(data.overview.siteHealthy, !data.overview.siteHealthy)}">
                <span>Site Health</span>
                <strong>${data.overview.siteHealthy ? "Healthy" : "Check"}</strong>
            </div>
        </div>

        ${renderWarnings(data)}

        <div class="admin-grid-2">
            <section class="admin-panel">
                <h2>Recent Orders</h2>
                ${renderRecentOrders(data.recentOrders)}

                <div style="margin-top:18px;">
                    <a href="/admin-orders" class="admin-btn">Open All Orders</a>
                </div>
            </section>

            <section class="admin-panel">
                <h2>System Snapshot</h2>

                <div class="admin-row">
                    <span>Server</span>
                    <strong>${badge("good", "Online")}</strong>
                </div>

                <div class="admin-row">
                    <span>Uptime</span>
                    <strong>${formatDuration(data.server.uptimeSeconds)}</strong>
                </div>

                <div class="admin-row">
                    <span>Stripe</span>
                    <strong>${stripeOk ? badge("good", "Connected") : badge("bad", "Issue")}</strong>
                </div>

                <div class="admin-row">
                    <span>AIS Tracking</span>
                    <strong>${aisOk ? badge("good", "Open") : badge("warning", data.ais.connection)}</strong>
                </div>

                <div class="admin-row">
                    <span>Latest Vessel Data</span>
                    <strong>${vesselFresh ? badge("good", formatAge(data.vessel.dataAgeSeconds)) : badge("warning", formatAge(data.vessel.dataAgeSeconds))}</strong>
                </div>

                <div style="margin-top:18px;">
                    <a href="/admin-status" class="admin-btn">Full Status</a>
                </div>
            </section>
        </div>

        <div class="admin-grid-2">
            <section class="admin-panel">
                <h2>Quick Actions</h2>

                <div class="admin-grid-4" style="grid-template-columns:repeat(2,minmax(160px,1fr));margin:0;">
                    <a href="/admin-orders" class="admin-card">
                        <span>Payments</span>
                        <strong>Orders</strong>
                    </a>

                    <a href="/admin-products" class="admin-card">
                        <span>Store</span>
                        <strong>Products</strong>
                    </a>

                    <a href="/admin-messages" class="admin-card">
                        <span>Customer</span>
                        <strong>Messages</strong>
                    </a>

                    <a href="/track" target="_blank" rel="noopener noreferrer" class="admin-card">
                        <span>Live Map</span>
                        <strong>Vessel</strong>
                    </a>
                </div>
            </section>

            <section class="admin-panel">
                <h2>Recent Messages</h2>
                ${renderMessages(data.recentMessages)}
            </section>
        </div>

        <div class="admin-grid-2">
            <section class="admin-panel">
                <h2>Today</h2>

                <div class="admin-row">
                    <span>Paid Orders Today</span>
                    <strong>${data.overview.paidOrdersToday}</strong>
                </div>

                <div class="admin-row">
                    <span>Revenue Today</span>
                    <strong>${moneyFromPence(data.overview.todayPaidRevenue)}</strong>
                </div>

                <div class="admin-row">
                    <span>Recent Sessions Checked</span>
                    <strong>${data.overview.totalRecentOrders}</strong>
                </div>
            </section>

            <section class="admin-panel">
                <h2>Vessel Snapshot</h2>

                <div class="admin-row">
                    <span>Name</span>
                    <strong>${escapeHTML(data.vessel.name)}</strong>
                </div>

                <div class="admin-row">
                    <span>MMSI</span>
                    <strong>${escapeHTML(data.vessel.mmsi)}</strong>
                </div>

                <div class="admin-row">
                    <span>Position</span>
                    <strong>
                        ${
                            data.vessel.latitude && data.vessel.longitude
                                ? `${Number(data.vessel.latitude).toFixed(5)}, ${Number(data.vessel.longitude).toFixed(5)}`
                                : "No position"
                        }
                    </strong>
                </div>
            </section>
        </div>
    `;
}

async function loadDashboard() {
    dashboard.innerHTML = `<div class="admin-loading">Loading admin dashboard...</div>`;

    try {
        const res = await window.adminFetch("/api/admin/dashboard");

        if (!res) return;

        const data = await res.json();

        if (!data.success) {
            dashboard.innerHTML = `<div class="admin-empty">Dashboard API returned an error.</div>`;
            return;
        }

        dashboardData = data;

        lastChecked.textContent = `Last checked: ${new Date().toLocaleString()}`;

        renderDashboard(data);

    } catch (err) {
        console.error(err);
        dashboard.innerHTML = `<div class="admin-empty">Could not load dashboard.</div>`;
    }
}

async function copyStatusReport() {
    if (!dashboardData) return;

    const report = `
POTS OF PLENTY ADMIN REPORT

Site Health: ${dashboardData.overview.siteHealthy ? "Healthy" : "Needs Check"}
Recent Paid Orders: ${dashboardData.overview.paidRecentOrders}
Recent Revenue: ${moneyFromPence(dashboardData.overview.recentPaidRevenue)}
Unread Messages: ${dashboardData.overview.unreadMessages}

Stripe Connected: ${dashboardData.stripe.apiConnected ? "Yes" : "No"}
AIS Connection: ${dashboardData.ais.connection}
Vessel Data: ${formatAge(dashboardData.vessel.dataAgeSeconds)}

Warnings:
${
    dashboardData.warnings.length
        ? dashboardData.warnings.map((warning) => `- ${warning}`).join("\n")
        : "- None"
}

Checked: ${new Date().toLocaleString()}
`.trim();

    try {
        await navigator.clipboard.writeText(report);
        alert("Report copied");
    } catch {
        prompt("Copy report:", report);
    }
}

refreshBtn.addEventListener("click", loadDashboard);
copyReportBtn.addEventListener("click", copyStatusReport);

loadDashboard();
setInterval(loadDashboard, 60000);
</script>

</body>
</html>
