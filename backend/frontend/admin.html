<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Pots of Plenty</title>

    <link rel="stylesheet" href="/style.css" />
    <script src="/admin.js" defer></script>
</head>

<body>

<section class="section" style="max-width:500px; margin:auto; padding:120px 20px;">

    <h1 style="margin-bottom:30px;">Admin Login</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
            style="width:100%;padding:14px;margin-bottom:15px;"
        />

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
            style="width:100%;padding:14px;margin-bottom:15px;"
        />

        <button class="hero-btn" type="submit">
            LOGIN
        </button>

    </form>

    <p id="message" style="margin-top:20px;"></p>

</section>

</body>
</html>
