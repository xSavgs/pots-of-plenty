<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Payment Successful — Pots of Plenty</title>

    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            font-family: Inter, sans-serif;
            background: #0f0f0f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .box {
            max-width: 500px;
            padding: 40px;
            background: #1a1a1a;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        h1 {
            color: #4ade80;
            margin-bottom: 10px;
        }

        p {
            opacity: 0.8;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            background: white;
            color: black;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
        }

        a:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Payment Successful 🎉</h1>
        <p>Thanks for your order. Your payment has been received successfully.</p>
        <a href="/shop">Continue Shopping</a>
    </div>
</body>
</html>
