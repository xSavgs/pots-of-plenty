<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POTS OF PLENTY - Radar Tracker</title>

<link rel="stylesheet" href="/style.css">

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #0a1a2e 0%, #061220 100%);
    color: #00e5ff;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    min-height: 100vh;
}

/* Subtle scan line effect (much lighter) */
body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        0deg,
        rgba(0, 229, 255, 0.02) 0px,
        rgba(0, 229, 255, 0.02) 2px,
        transparent 2px,
        transparent 8px
    );
    pointer-events: none;
    z-index: 1;
}

.tracker-wrapper {
    width: 95%;
    max-width: 1600px;
    margin: auto;
    padding: 20px 0;
    position: relative;
    z-index: 2;
}

/* Radar-style header - no spinning */
.radar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 15px 20px;
    background: rgba(6, 18, 32, 0.9);
    border: 1px solid #00e5ff;
    border-radius: 8px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
}

.vessel-info {
    display: flex;
    gap: 30px;
    align-items: baseline;
    flex-wrap: wrap;
}

.vessel-name {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    text-shadow: 0 0 5px #00e5ff;
}

.mmsi {
    font-size: 14px;
    opacity: 0.7;
}

.status-badge {
    display: flex;
    gap: 15px;
}

.status {
    color: #00ff88;
}

.status-live {
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

/* Map container with radar styling */
.map-container {
    position: relative;
    border: 2px solid #00e5ff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
    margin-bottom: 20px;
    background: #fff; /* Fallback */
}

#map {
    height: 600px;
    background: #e8f4f8 !important; /* Light background fallback */
}

/* Brighter map tiles - make the map visible! */
.leaflet-tile-pane {
    filter: brightness(1) contrast(1) saturate(1.2);
}

/* Make the map clearer */
.leaflet-container {
    background: #d4e6f1 !important;
}

/* Custom marker glow */
.vessel-marker {
    filter: drop-shadow(0 0 8px #00e5ff);
}

/* Data panel */
.data-panel {
    background: rgba(6, 18, 32, 0.95);
    border: 1px solid #00e5ff;
    border-radius: 8px;
    padding: 20px;
    backdrop-filter: blur(10px);
    margin-top: 20px;
}

.data-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 10px;
}

.data-item {
    border-left: 3px solid #00e5ff;
    padding-left: 15px;
}

.data-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
    margin-bottom: 5px;
}

.data-value {
    font-size: 20px;
    font-weight: bold;
    color: #00e5ff;
    text-shadow: 0 0 3px rgba(0, 229, 255, 0.3);
}

/* Button controls */
.control-buttons {
    display: flex;
    gap: 15px;
    margin: 20px 0;
}

.radar-btn {
    background: rgba(6, 18, 32, 0.9);
    border: 1px solid #00e5ff;
    color: #00e5ff;
    padding: 10px 20px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 5px;
}

.radar-btn:hover {
    background: #00e5ff;
    color: #061220;
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    transform: translateY(-2px);
}

/* Compass rose - no animation */
.compass {
    position: absolute;
    bottom: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    background: rgba(6, 18, 32, 0.8);
    border: 1px solid #00e5ff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    font-size: 20px;
    font-weight: bold;
    pointer-events: none;
}

.compass::before {
    content: 'N';
    color: #ff4444;
    font-size: 18px;
}

/* Responsive */
@media (max-width: 768px) {
    .radar-header {
        flex-direction: column;
        gap: 15px;
    }
    
    .vessel-info {
        flex-direction: column;
        gap: 10px;
    }
    
    .vessel-name {
        font-size: 20px;
    }
    
    .data-grid {
        grid-template-columns: 1fr;
    }
}

/* Signal indicator */
.signal-strength {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00ff88;
    border-radius: 50%;
    margin-right: 5px;
    animation: pulse 2s ease-in-out infinite;
}
</style>

</head>
<body>

<div class="tracker-wrapper">
    <!-- Radar-style header - no spinning text -->
    <div class="radar-header">
        <div class="vessel-info">
            <div class="vessel-name">
                ⚓ POTS OF PLENTY
            </div>
            <div class="mmsi">MMSI: 235059314</div>
            <div class="status-badge">
                <div class="status status-live">● LIVE TRACKING</div>
            </div>
        </div>
        <div class="radar-status">📡 RADAR ACTIVE</div>
    </div>

    <!-- Control buttons -->
    <div class="control-buttons">
        <button class="radar-btn" onclick="centerOnVessel()">🎯 CENTER ON VESSEL</button>
        <button class="radar-btn" onclick="refreshData()">🔄 FORCE UPDATE</button>
        <button class="radar-btn" onclick="toggleRadarMode()">📡 TOGGLE RANGE RINGS</button>
    </div>

    <!-- Map container with compass -->
    <div class="map-container">
        <div id="map"></div>
        <div class="compass"></div>
    </div>

    <!-- Data panel -->
    <div class="data-panel">
        <div class="data-grid">
            <div class="data-item">
                <div class="data-label">LAST FIX</div>
                <div class="data-value" id="lastUpdate">WAITING FOR SIGNAL...</div>
            </div>
            <div class="data-item">
                <div class="data-label">POSITION</div>
                <div class="data-value" id="position">---</div>
            </div>
            <div class="data-item">
                <div class="data-label">SPEED</div>
                <div class="data-value" id="speed">---</div>
            </div>
            <div class="data-item">
                <div class="data-label">COURSE</div>
                <div class="data-value" id="course">---</div>
            </div>
            <div class="data-item">
                <div class="data-label">STATUS</div>
                <div class="data-value" id="signalStatus">
                    <span class="signal-strength"></span> ACQUIRING
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Custom radar-style boat icon
const vesselIcon = L.divIcon({
    html: '<div style="font-size: 32px; filter: drop-shadow(0 0 3px #00e5ff);">⛵</div>',
    iconSize: [32, 32],
    className: 'vessel-marker'
});

// Use standard map tiles that are bright and clear
const map = L.map("map", {
    zoomControl: true,
    fadeAnimation: true,
    zoomAnimation: true
}).setView([54.2798, -0.4044], 14);

// Use standard OpenStreetMap tiles (they're bright and clear)
L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 19
    }
).addTo(map);

let marker = null;
let radarCircle = null;
let radarMode = false;

// Function to add radar range rings
function updateRadarRings(centerLat, centerLon) {
    if (radarCircle) {
        map.removeLayer(radarCircle);
    }
    
    radarCircle = L.circle([centerLat, centerLon], {
        color: '#00e5ff',
        fillColor: 'rgba(0, 229, 255, 0.05)',
        weight: 2,
        opacity: 0.6,
        radius: 500 // 500 meters range
    }).addTo(map);
}

async function loadVessel() {
    try {
        const res = await fetch("/api/vessel");
        const data = await res.json();
        
        if(!data.success){
            document.getElementById("signalStatus").innerHTML = '<span style="color: #ff6666;">⚠ SIGNAL LOST</span>';
            return;
        }

        const lat = data.latitude;
        const lon = data.longitude;
        
        // Update signal status
        document.getElementById("signalStatus").innerHTML = '<span class="signal-strength"></span> SIGNAL ACQUIRED';
        
        // Update position display
        document.getElementById("position").innerHTML = `${lat.toFixed(6)}° N<br>${lon.toFixed(6)}° E`;
        
        // Update speed and course if available
        if (data.sog !== undefined && data.sog > 0) {
            const speedKnots = data.sog;
            const speedKmph = (speedKnots * 1.852).toFixed(1);
            document.getElementById("speed").innerHTML = `${speedKnots.toFixed(1)} kn<br><span style="font-size:11px;">${speedKmph} km/h</span>`;
        } else {
            document.getElementById("speed").innerHTML = '0 kn<br><span style="font-size:11px;">At anchor</span>';
        }
        
        if (data.cog !== undefined && data.cog > 0) {
            document.getElementById("course").innerHTML = `${data.cog.toFixed(0)}°<br><span style="font-size:11px;">${getCardinalDirection(data.cog)}</span>`;
        } else {
            document.getElementById("course").innerHTML = '---°<br><span style="font-size:11px;">--</span>';
        }
        
        // Update last fix time
        const updateTime = new Date(data.timestamp);
        const timeAgo = Math.floor((Date.now() - updateTime) / 1000 / 60);
        document.getElementById("lastUpdate").innerHTML = `${updateTime.toLocaleTimeString()}<br><span style="font-size:11px;">${timeAgo} minutes ago</span>`;
        
        // Update marker
        if(!marker){
            marker = L.marker([lat, lon], { icon: vesselIcon })
            .addTo(map)
            .bindPopup(`
                <div style="font-family: monospace; background: #fff; color: #061220; padding: 5px;">
                    <b>⚓ POTS OF PLENTY</b><br>
                    ${data.sog ? `Speed: ${data.sog.toFixed(1)} kn<br>` : ''}
                    ${data.cog ? `Course: ${data.cog.toFixed(0)}°<br>` : ''}
                    Last update: ${updateTime.toLocaleTimeString()}
                </div>
            `);
        } else {
            marker.setLatLng([lat, lon]);
        }
        
        // Update radar rings if in radar mode
        if (radarMode) {
            updateRadarRings(lat, lon);
        }
        
        // Only auto-center if user hasn't moved the map recently
        if (!userMovedMap) {
            map.setView([lat, lon], 14);
        }
        
    } catch(err){
        console.error(err);
        document.getElementById("signalStatus").innerHTML = '<span style="color: #ff6666;">⚠ CONNECTION ERROR</span>';
    }
}

// Helper function for cardinal directions
function getCardinalDirection(degrees) {
    const directions = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
    const index = Math.round(degrees / 22.5) % 16;
    return directions[index];
}

let userMovedMap = false;

// Detect when user moves the map
map.on('dragstart', () => {
    userMovedMap = true;
});

function centerOnVessel() {
    if (marker) {
        const pos = marker.getLatLng();
        map.setView(pos, 15);
        marker.openPopup();
        userMovedMap = false;
    } else {
        alert("Waiting for vessel position data...");
    }
}

function refreshData() {
    loadVessel();
    const btn = event.target;
    const originalText = btn.textContent;
    btn.textContent = '🔄 UPDATING...';
    setTimeout(() => {
        btn.textContent = originalText;
    }, 1000);
}

function toggleRadarMode() {
    radarMode = !radarMode;
    if (radarMode && marker) {
        const pos = marker.getLatLng();
        updateRadarRings(pos.lat, pos.lng);
    } else if (radarCircle) {
        map.removeLayer(radarCircle);
        radarCircle = null;
    }
}

// Load initial data
loadVessel();

// Update every 30 seconds
setInterval(loadVessel, 30000);
</script>

</body>
</html>
